name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          # This makes Actions fetch all Git history so that Changesets can generate changelogs with the right commits
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Typecheck
        run: npm run typecheck

      - name: Run Lint
        run: npm run lint

      - name: Check Style Conventions
        run: npm run test:conventions

      - name: Run Tests With Coverage
        run: npm run test:coverage

      - name: Build Library
        run: npm run build

      - name: Verify Package Exports
        run: npm run test:exports

      - name: Verify Packed Package
        run: npm run test:package

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          publish: npm run release
          commit: "ci(release): version packages"
          title: "ci(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Purge and Pre-warm CDN Edges (unpkg & jsDelivr)
        if: steps.changesets.outputs.published == 'true'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "Published version: $VERSION"
          
          echo "Pre-warming unpkg CDN..."
          curl -s -o /dev/null -w "unpkg index.css status: %{http_code}\n" "https://unpkg.com/@runox/ui@${VERSION}/dist/index.css" || true
          curl -s -o /dev/null -w "unpkg registry.json status: %{http_code}\n" "https://unpkg.com/@runox/ui@${VERSION}/dist/registry.json" || true
          
          echo "Purging and pre-warming jsDelivr CDN..."
          curl -s -o /dev/null -w "jsDelivr purge status: %{http_code}\n" "https://purge.jsdelivr.net/npm/@runox/ui/dist/index.css" || true
          curl -s -o /dev/null -w "jsDelivr index.css status: %{http_code}\n" "https://cdn.jsdelivr.net/npm/@runox/ui@${VERSION}/dist/index.css" || true
          
          echo "CDN deployment and edge cache warming completed."
